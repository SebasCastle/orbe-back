server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: orbe
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/orbe;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      max-lifetime: 300000
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  jackson:
    serialization:
      write-dates-as-timestamps: false

orbe:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  omdb:
    api-key: ${OMDB_API_KEY:}
    base-url: ${OMDB_BASE_URL:https://www.omdbapi.com/}
  swapi:
    base-url: ${SWAPI_BASE_URL:https://swapi.py4e.com/api}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/spotify/callback}
  jwt:
    secret: ${JWT_SECRET:}
  catalog:
    seed: ${CATALOG_SEED:true}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
