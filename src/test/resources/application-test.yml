spring:
  datasource:
    url: jdbc:h2:mem:orbe;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

orbe:
  jwt:
    secret: orbe-test-jwt-secret-must-be-at-least-32
  catalog:
    seed: false
